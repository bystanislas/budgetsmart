L 169 208 Z" fill="url(#or)" fill-opacity="0.93"/><path d="M 173 208 L 173 92 L 192.5 44 L 212 92 L 212 208 Z" fill="url(#or)"/><rect x="40" y="208" width="176" height="7" rx="3.5" fill="#D9A93C" fill-opacity="0.38"/></g><g transform="translate(1265,734) scale(0.09)"><rect x="0" y="0" width="260" height="260" rx="58" fill="url(#nuit)"/><rect x="13" y="13" width="234" height="234" rx="47" fill="none" stroke="#D9A93C" stroke-opacity="0.28" stroke-width="2"/><path d="M 44 208 L 44 172 Q 44 164 52 164 L 75 164 Q 83 164 83 172 L 83 208 Z" fill="url(#or)" fill-opacity="0.62"/><path d="M 87 208 L 87 138 Q 87 130 95 130 L 118 130 Q 126 130 126 138 L 126 208 Z" fill="url(#or)" fill-opacity="0.79"/><path d="M 130 208 L 130 104 Q 130 96 138 96 L 161 96 Q 169 96 169 104 L 169 208 Z" fill="url(#or)" fill-opacity="0.93"/><path d="M 173 208 L 173 92 L 192.5 44 L 212 92 L 212 208 Z" fill="url(#or)"/><rect x="40" y="208" width="176" height="7" rx="3.5" fill="#D9A93C" fill-opacity="0.38"/></g><text x="1120" y="820" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="600" letter-spacing="0" fill="#7A8794" text-anchor="start">Favicon / petites tailles</text><rect x="70" y="870" width="1260" height="1" fill="#E3E8EF"/><rect x="70" y="914" width="5" height="30" fill="#B8860B"/><text x="92" y="940" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#1A3557">03 — PALETTE</text><rect x="70" y="970" width="185" height="96" rx="8" fill="#1A3557" stroke="#E3E8EF"/><text x="70" y="1090" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0" fill="#1A3557" text-anchor="start">Bleu nuit</text><text x="70" y="1110" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#7A8794" text-anchor="start">#1A3557</text><rect x="285" y="970" width="185" height="96" rx="8" fill="#B8860B" stroke="#E3E8EF"/><text x="285" y="1090" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0" fill="#1A3557" text-anchor="start">Or APEX</text><text x="285" y="1110" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#7A8794" text-anchor="start">#B8860B</text><rect x="500" y="970" width="185" height="96" rx="8" fill="#D9A93C" stroke="#E3E8EF"/><text x="500" y="1090" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0" fill="#1A3557" text-anchor="start">Or clair</text><text x="500" y="1110" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#7A8794" text-anchor="start">#D9A93C</text><rect x="715" y="970" width="185" height="96" rx="8" fill="#FDF6E3" stroke="#E3E8EF"/><text x="715" y="1090" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0" fill="#1A3557" text-anchor="start">Crème</text><text x="715" y="1110" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#7A8794" text-anchor="start">#FDF6E3</text><rect x="930" y="970" width="185" height="96" rx="8" fill="#E07B22" stroke="#E3E8EF"/><text x="930" y="1090" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0" fill="#1A3557" text-anchor="start">Orange APEX</text><text x="930" y="1110" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#7A8794" text-anchor="start">#E07B22</text><rect x="1145" y="970" width="185" height="96" rx="8" fill="#404040" stroke="#E3E8EF"/><text x="1145" y="1090" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0" fill="#1A3557" text-anchor="start">Gris ardoise</text><text x="1145" y="1110" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#7A8794" text-anchor="start">#404040</text><rect x="70" y="1150" width="1260" height="1" fill="#E3E8EF"/><rect x="70" y="1184" width="5" height="30" fill="#B8860B"/><text x="92" y="1210" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#1A3557">04 — TYPOGRAPHIE</text><text x="70" y="1276" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="44" font-weight="700" letter-spacing="0" fill="#1A3557" text-anchor="start">Arial</text><text x="70" y="1306" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#404040" text-anchor="start">Titres — Bold, interlettrage +2 à +4</text><text x="70" y="1332" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#404040" text-anchor="start">Corps — Regular 10/11 pt, gris ardoise</text><text x="560" y="1260" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0" fill="#1A3557" text-anchor="start">ABCDEFGHIJKLMNOPQRSTUVWXYZ</text><text x="560" y="1290" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0" fill="#404040" text-anchor="start">abcdefghijklmnopqrstuvwxyz</text><text x="560" y="1320" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="0" fill="#B8860B" text-anchor="start">0123456789  €  $  FCFA  £  ₦</text><rect x="70" y="1380" width="1260" height="1" fill="#E3E8EF"/><rect x="70" y="1404" width="5" height="30" fill="#B8860B"/><text x="92" y="1430" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#1A3557">05 — RÈGLES D’USAGE</text><rect x="70" y="1456" width="600" height="150" rx="8" fill="#F0F7F2" stroke="#1E6B3C" stroke-opacity="0.35"/><text x="90" y="1484" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#1E6B3C" text-anchor="start">À FAIRE</text><text x="90" y="1512" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#404040" text-anchor="start">•  Réserver autour du logo une marge égale à la hauteur du monogramme.</text><text x="90" y="1538" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#404040" text-anchor="start">•  Utiliser la version fond sombre dès que le fond est plus foncé que le crème.</text><text x="90" y="1564" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#404040" text-anchor="start">•  Taille minimale : 24 px de haut pour le monogramme, 90 px pour le logo complet.</text><rect x="730" y="1456" width="600" height="150" rx="8" fill="#FCF2F2" stroke="#8B1A1A" stroke-opacity="0.35"/><text x="750" y="1484" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#8B1A1A" text-anchor="start">À ÉVITER</text><text x="750" y="1512" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#404040" text-anchor="start">•  Déformer, incliner ou changer les proportions du symbole.</text><text x="750" y="1538" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#404040" text-anchor="start">•  Recolorer le logo hors palette, ou le poser sur une photo chargée.</text><text x="750" y="1564" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="0" fill="#404040" text-anchor="start">•  Séparer le monogramme du bloc « BY APEX AFRICA » sur un support officiel.</text><rect x="0" y="1680" width="1400" height="70" fill="#1A3557"/><text x="70" y="1712" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0" fill="#FFFFFF" text-anchor="start">APEX AFRICA — African Premium Experience</text><text x="70" y="1734" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" font-weight="400" letter-spacing="0" fill="#9FB0C4" text-anchor="start">Abidjan, Côte d’Ivoire · contact@apxafrica.com · www.apxafrica.com</text></svg>
