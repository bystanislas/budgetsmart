260" height="260" rx="58" fill="url(#nuit)"/><rect x="13" y="13" width="234" height="234" rx="47" fill="none" stroke="#D9A93C" stroke-opacity="0.28" stroke-width="2"/><path d="M 44 208 L 44 172 Q 44 164 52 164 L 75 164 Q 83 164 83 172 L 83 208 Z" fill="url(#or)" fill-opacity="0.62"/><path d="M 87 208 L 87 138 Q 87 130 95 130 L 118 130 Q 126 130 126 138 L 126 208 Z" fill="url(#or)" fill-opacity="0.79"/><path d="M 130 208 L 130 104 Q 130 96 138 96 L 161 96 Q 169 96 169 104 L 169 208 Z" fill="url(#or)" fill-opacity="0.93"/><path d="M 173 208 L 173 92 L 192.5 44 L 212 92 L 212 208 Z" fill="url(#or)"/><rect x="40" y="208" width="176" height="7" rx="3.5" fill="#D9A93C" fill-opacity="0.38"/></g><text x="340" y="398" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#1A3557" text-anchor="start">Trois colonnes qui montent</text><text x="340" y="420" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#404040" text-anchor="start">le budget qui se construit mois après mois.</text><text x="340" y="444" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#1A3557" text-anchor="start">Une quatrième en pointe</text><text x="340" y="466" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#404040" text-anchor="start">l’apex : l’objectif atteint.</text><text x="340" y="490" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#1A3557" text-anchor="start">Or sur bleu nuit</text><text x="340" y="512" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#404040" text-anchor="start">les deux couleurs signature d’APEX AFRICA.</text><text x="340" y="536" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="0" fill="#1A3557" text-anchor="start">Un socle discret</text><text x="340" y="558" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#404040" text-anchor="start">la ligne de base, la discipline du chiffre.</text><rect x="70" y="600" width="1260" height="1" fill="#E3E8EF"/><rect x="70" y="634" width="5" height="30" fill="#B8860B"/><text x="92" y="660" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#1A3557">02 — DÉCLINAISONS</text><g transform="translate(70,694) scale(0.30)"><g><rect x="0" y="0" width="260" height="260" rx="58" fill="url(#nuit)"/><rect x="13" y="13" width="234" height="234" rx="47" fill="none" stroke="#D9A93C" stroke-opacity="0.28" stroke-width="2"/><path d="M 44 208 L 44 172 Q 44 164 52 164 L 75 164 Q 83 164 83 172 L 83 208 Z" fill="url(#or)" fill-opacity="0.62"/><path d="M 87 208 L 87 138 Q 87 130 95 130 L 118 130 Q 126 130 126 138 L 126 208 Z" fill="url(#or)" fill-opacity="0.79"/><path d="M 130 208 L 130 104 Q 130 96 138 96 L 161 96 Q 169 96 169 104 L 169 208 Z" fill="url(#or)" fill-opacity="0.93"/><path d="M 173 208 L 173 92 L 192.5 44 L 212 92 L 212 208 Z" fill="url(#or)"/><rect x="40" y="208" width="176" height="7" rx="3.5" fill="#D9A93C" fill-opacity="0.38"/></g><g transform="translate(312,0)"><text x="0" y="158" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="2.88" text-anchor="start"><tspan fill="#1A3557">BUDGET</tspan><tspan fill="#B8860B"> SMART</tspan></text><rect x="0" y="177.2" width="515.2" height="2.88" fill="#B8860B" rx="1"/><text x="0" y="216.88" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19.2" font-weight="600" letter-spacing="10.24" fill="#404040" text-anchor="start">BY APEX AFRICA</text></g></g><text x="70" y="820" font-family="Liberation Sans, A